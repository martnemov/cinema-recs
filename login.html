<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход — Следующий кадр</title><link rel="stylesheet" href="/style.css"><style>main{max-width:460px;margin:12vh auto;padding:24px} form,label{display:grid;gap:12px} input{padding:12px;font:inherit} .button{display:inline-flex;justify-content:center;margin:16px 0} [hidden]{display:none!important}</style><script src="/login.js" defer></script></head><body><main><a class="brand" href="/login.html"><span class="brand-icon">к.</span> следующий кадр</a><h1>Что смотрим дальше?</h1><p>Войдите через Яндекс ID, чтобы получить рекомендации по вашим оценкам Кинопоиска.</p><a id="sign-in" class="button primary" href="/api/auth?action=login">Войти с Яндекс ID</a><form id="profile-form" hidden><label>Имя или ID открытого профиля Кинопоиска<input id="profile" required maxlength="80"></label><p>Проверьте профиль: логины Яндекса и Кинопоиска могут отличаться. Импортируются только доступные через API оценки.</p><button class="button primary" type="submit">Подключить профиль</button></form><p id="status" role="status"></p></main></body></html>
